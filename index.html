<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game JARN - RPG Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu-screen" class="screen active">
    <div class="menu-container">
      <div class="logo">
        <h1>⚔️ GAME JARN ⚔️</h1>
        <p class="subtitle">RPG de Aventura Épica</p>
        <p class="creator">Creator: Alejandro</p>
      </div>
      <div class="menu-buttons">
        <button id="startBtn" class="btn-primary">INICIAR AVENTURA</button>
        <button id="settingsBtn" class="btn-secondary">CONFIGURACIÓN</button>
        <button id="creditsBtn" class="btn-secondary">CRÉDITOS</button>
      </div>
    </div>
  </div>

  <div id="game-screen" class="screen">
    <header class="topbar">
      <div class="title-block">
        <h1>⚔️ GAME JARN ⚔️</h1>
        <p id="level-display">Nivel: 1</p>
      </div>
      <div class="stats-display">
        <div class="stat-box">
          <span class="stat-label">HP</span>
          <div class="stat-bar">
            <div id="hp-bar" class="bar-fill"></div>
          </div>
          <span id="hp-text">100/100</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">MANA</span>
          <div class="stat-bar">
            <div id="mana-bar" class="bar-fill"></div>
          </div>
          <span id="mana-text">100/100</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">EXP</span>
          <div class="stat-bar">
            <div id="exp-bar" class="bar-fill"></div>
          </div>
          <span id="exp-text">0/100</span>
        </div>
      </div>
      <div class="resources">
        <span id="gold">💰 0</span>
        <span id="gems">💎 0</span>
      </div>
    </header>

    <main class="game-area">
      <div id="map-container">
        <div id="minimap" class="minimap"></div>
        <div id="map">
          <div id="player" class="entity player"></div>
          <div id="particles-container"></div>
        </div>
      </div>

      <aside class="side-panel">
        <div class="panel-section quest-panel">
          <div class="section-header">
            <h2>📜 MISIÓN PRINCIPAL</h2>
          </div>
          <div class="quest-info">
            <p id="quest-title">Derrota de los Enemigos</p>
            <p id="quest-progress">Enemigos derrotados: 0/10</p>
            <div class="quest-bar">
              <div id="quest-bar-fill" class="bar-fill"></div>
            </div>
          </div>
        </div>

        <div class="panel-section inventory-panel">
          <div class="section-header">
            <h2>🎒 INVENTARIO</h2>
          </div>
          <div id="inventory" class="inventory-grid"></div>
        </div>

        <div class="panel-section actions-panel">
          <div class="section-header">
            <h2>⚡ ACCIONES</h2>
          </div>
          <div class="action-buttons">
            <button id="attackBtn" class="action-btn btn-attack">
              <span class="btn-title">Ataque Básico</span>
              <span class="btn-desc">Daño: 15</span>
            </button>
            <button id="fireBoltBtn" class="action-btn btn-skill">
              <span class="btn-title">Fuego Arcano</span>
              <span class="btn-desc">Mana: 20 | Daño: 35</span>
            </button>
            <button id="healBtn" class="action-btn btn-heal">
              <span class="btn-title">Curación</span>
              <span class="btn-desc">Mana: 15 | Cura: 30</span>
            </button>
            <button id="shieldBtn" class="action-btn btn-shield">
              <span class="btn-title">Escudo Mágico</span>
              <span class="btn-desc">Mana: 25 | Defensa: 50%</span>
            </button>
          </div>
        </div>

        <div class="panel-section log-panel">
          <div class="section-header">
            <h2>📝 REGISTRO</h2>
          </div>
          <div id="log" class="log-content"></div>
        </div>
      </aside>
    </main>
  </div>

  <div id="pause-modal" class="modal">
    <div class="modal-content">
      <h2>PAUSA</h2>
      <button id="resumeBtn" class="btn-primary">Continuar</button>
      <button id="menuBtn" class="btn-secondary">Menú Principal</button>
    </div>
  </div>

  <div id="game-over-modal" class="modal">
    <div class="modal-content game-over">
      <h2 id="game-over-title">¡GAME OVER!</h2>
      <p id="game-over-stats"></p>
      <button id="restartBtn" class="btn-primary">Reintentar</button>
      <button id="menuBtn2" class="btn-secondary">Menú Principal</button>
    </div>
  </div>

  <audio id="bgm" loop>
    <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQIAAAAAAA==" type="audio/wav">
  </audio>

  <script src="game.js"></script>
</body>
</html>
